name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 패키지 구성이 갑자기 바뀌지 않도록 Ubuntu 버전을 고정
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      # 노트를 LaTeX로 변환·컴파일해서 PDF 다운로드 파일을 만든다 (scripts/md2latex.py)
      # 받은 .deb 파일을 캐시해 두면 다음 실행부터는 미러에서 다시 받지 않는다
      # (Ubuntu 미러가 가끔 다운로드 도중 멈춰서 설치 단계가 15분씩 걸리던 문제)
      - uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-latex-${{ runner.os }}-24.04-v1
      - name: Install LaTeX
        timeout-minutes: 25
        run: |
          PKGS="pandoc librsvg2-bin fonts-noto-cjk fonts-lmodern lmodern texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended"
          mkdir -p ~/apt-cache/partial
          # 네트워크가 멈추면 오래 기다리지 말고 빨리 실패하고 다시 시도
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::archives=$HOME/apt-cache -o DPkg::Lock::Timeout=120"
          # man 페이지 색인 갱신은 필요 없고 느리므로 끈다
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          for i in 1 2 3; do
            sudo timeout 120 apt-get update $APT_OPTS && break
            echo "::warning::apt-get update attempt $i failed"
          done
          # 1) 다운로드만 짧은 제한시간 안에서 시도한다. 미러가 아주 느리게 데이터를 흘려보내면
          #    Acquire 타임아웃이 걸리지 않으므로(실제로 fonts-noto-cjk 61MB에서 멈췄음)
          #    3분 안에 못 받으면 끊고 다른 미러로 바꿔 다시 받는다. 받다 만 파일은 이어 받는다.
          ok=0
          for mirror in default http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/; do
            if [ "$mirror" != default ]; then
              echo "::warning::download stalled, switching mirror to $mirror"
              echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt
            fi
            if sudo timeout 180 apt-get install -y --download-only --no-install-recommends $APT_OPTS $PKGS; then ok=1; break; fi
          done
          if [ "$ok" != 1 ]; then echo "::error::could not download LaTeX packages from any mirror"; exit 1; fi
          # 2) 설치는 받아 둔 파일로만 한다 (네트워크 없음, 중간에 끊지 않음)
          sudo apt-get install -y --no-install-recommends --no-download $APT_OPTS $PKGS
          command -v xelatex
          command -v pandoc
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$USER" ~/apt-cache
      - run: python scripts/md2latex.py --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
