name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 패키지 구성이 갑자기 바뀌지 않도록 Ubuntu 버전을 고정
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
      # 노트를 LaTeX로 변환·컴파일해서 PDF 다운로드 파일을 만든다 (scripts/md2latex.py)
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc librsvg2-bin fonts-noto-cjk fonts-lmodern lmodern \
            texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended
      - run: python scripts/md2latex.py --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
