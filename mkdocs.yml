site_name: 내 노트 2026-2
site_description: 2026년 2학기 필기 정리

theme:
  name: material
  custom_dir: overrides       # 홈(과목 목록) 템플릿: overrides/home.html
  language: ko
  features:
    - navigation.sections     # 왼쪽 메뉴를 과목별로 묶기
    - navigation.top          # 맨 위로 버튼
    - navigation.footer       # 이전/다음 노트 버튼
    - search.highlight
    - content.code.copy
  font: false                 # 글꼴은 stylesheets/extra.css에서 지정
  # 기본은 흰 종이(교과서·PDF와 같은 모습). 오른쪽 위 버튼으로 다크 모드 (색은 stylesheets/extra.css)
  palette:
    - scheme: default
      primary: white
      toggle:
        icon: material/weather-night
        name: 다크 모드로
    - scheme: slate
      primary: black
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로

plugins:
  - search

markdown_extensions:
  - pymdownx.arithmatex:      # $...$, $$...$$ 수식
      generic: true
  - admonition                # !!! note 같은 상자
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - attr_list
  - md_in_html                # 그림에 캡션 달기
  - toc:
      permalink: true

# 홈 화면 (overrides/home.html). 과목을 추가하면 courses에 한 줄 추가
extra:
  home:
    rail_left: 내 노트
    rail_right: 2026 · 2학기
    intro_strong: 2026년 2학기 수업 필기를
    intro_dim: 교과서처럼 정리한 노트입니다.
  courses:
    - { id: differential-geometry, ko: 미분기하학, en: Differential Geometry }
    - { id: modern-physics, ko: 현대물리학, en: Modern Physics }
    - { id: modern-algebra, ko: 현대대수 특강, en: Modern Algebra }

extra_css:
  - https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/lang.js
  - javascripts/pdfview.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

# 왼쪽 메뉴 순서. 새 노트를 만들면 여기에 한 줄 추가하면 됨
# (이 nav 블록을 통째로 지우면 폴더 구조대로 자동 생성됨)
nav:
  - 홈: index.md
  - Differential Geometry:
      - 소개 · 목차: differential-geometry/index.md
      - "Chapter 1: Curves": differential-geometry/chapter1.md
  - Modern Physics:
      - 소개 · 목차: modern-physics/index.md
      - "Part I: Quantum (Ch. 5, midterm)": modern-physics/qm1d.md
      - "Part I: Quantum (Ch. 6, final)": modern-physics/quantum.md
      - "Part II: Relativity I (midterm)": modern-physics/sr1.md
      - "Part II: Relativity II (final)": modern-physics/sr2.md
  - Modern Algebra (special lecture):
      - 소개 · 목차: modern-algebra/index.md
      - "Day 1: Finite Fields (25 Nov)": modern-algebra/day1.md
  - 노트 쓰는 법: guide.md
